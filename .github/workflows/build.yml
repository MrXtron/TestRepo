name: Build and Output Plugins

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        working-directory: src
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          DUMP_API: ${{ secrets.DUMP_API }}
          DUMP_KEY: ${{ secrets.DUMP_KEY }}
          ANICHI_API: ${{ secrets.ANICHI_API }}
          ANICHI_SERVER: ${{ secrets.ANICHI_SERVER }}
          ANICHI_ENDPOINT: ${{ secrets.ANICHI_ENDPOINT }}
          ANICHI_APP: ${{ secrets.ANICHI_APP }}
          ZSHOW_API: ${{ secrets.ZSHOW_API }}
          SFMOVIES_API: ${{ secrets.SFMOVIES_API }}
          CINEMATV_API: ${{ secrets.CINEMATV_API }}
          GHOSTX_API: ${{ secrets.GHOSTX_API }}
          SUPERSTREAM_FIRST_API: ${{ secrets.SUPERSTREAM_FIRST_API }}
          SUPERSTREAM_SECOND_API: ${{ secrets.SUPERSTREAM_SECOND_API }}
          SUPERSTREAM_THIRD_API: ${{ secrets.SUPERSTREAM_THIRD_API }}
          SUPERSTREAM_FOURTH_API: ${{ secrets.SUPERSTREAM_FOURTH_API }}
          AsianDrama_API: ${{ secrets.AsianDrama_API }}
          FanCode_API: ${{ secrets.FanCode_API }}
          Whvx_API: ${{ secrets.Whvx_API }}
          JapanIPTV: ${{ secrets.JapanIPTV }}
          SonyIPTV: ${{ secrets.SonyIPTV }}
          PirateIPTV: ${{ secrets.PirateIPTV }}
          Su_sports: ${{ secrets.Su_sports }}
          CatflixAPI: ${{ secrets.CatflixAPI }}
          ConsumetAPI: ${{ secrets.ConsumetAPI }}
          FlixHQAPI: ${{ secrets.FlixHQAPI }}
          WhvxAPI: ${{ secrets.WhvxAPI }}
          WhvxT: ${{ secrets.WhvxT }}
          SharmaflixApikey: ${{ secrets.SharmaflixApikey }}
          SharmaflixApi: ${{ secrets.SharmaflixApi }}
          Theyallsayflix: ${{ secrets.Theyallsayflix }}
          HianimeAPI: ${{ secrets.HianimeAPI }}
          Vidsrccc: ${{ secrets.Vidsrccc }}
          WASMAPI: ${{ secrets.WASMAPI }}
          KissKh: ${{ secrets.KissKh }}
          KisskhSub: ${{ secrets.KisskhSub }}
          StreamPlayAPI: ${{ secrets.StreamPlayAPI }}
          PROXYAPI: ${{ secrets.PROXYAPI }}
          KAISVA: ${{ secrets.KAISVA }}
          MAL_API: ${{ secrets.MAL_API }}
          MOVIEBOX_SECRET_KEY_ALT: ${{ secrets.MOVIEBOX_SECRET_KEY_ALT }}
          MOVIEBOX_SECRET_KEY_DEFAULT: ${{ secrets.MOVIEBOX_SECRET_KEY_DEFAULT }}
          SuperToken: ${{ secrets.SuperToken }}
          KAIDEC: ${{ secrets.KAIDEC }}
          KAIENC: ${{ secrets.KAIENC }}
          KAIMEG: ${{ secrets.KAIMEG }}
          NuvioStreams: ${{ secrets.NuvioStreams }}
          YFXENC: ${{ secrets.YFXENC }}
          YFXDEC: ${{ secrets.YFXDEC }}
          VideasyDEC: ${{ secrets.VideasyDEC }}
          NuvFeb: ${{ secrets.NuvFeb }}
          iStreamFlare: ${{ secrets.iStreamFlare }}
          iStreamFlareSecretKey: ${{ secrets.iStreamFlareSecretKey }}
          iStreamFlareSalt: ${{ secrets.iStreamFlareSalt }}

        run: |
          : > local.properties

          add_property() {
            printf '%s=%s\n' "$1" "$2" >> local.properties
          }

          add_property TMDB_API "$TMDB_API"
          add_property DUMP_API "$DUMP_API"
          add_property DUMP_KEY "$DUMP_KEY"
          add_property ANICHI_API "$ANICHI_API"
          add_property ANICHI_SERVER "$ANICHI_SERVER"
          add_property ANICHI_ENDPOINT "$ANICHI_ENDPOINT"
          add_property ANICHI_APP "$ANICHI_APP"
          add_property ZSHOW_API "$ZSHOW_API"
          add_property SFMOVIES_API "$SFMOVIES_API"
          add_property CINEMATV_API "$CINEMATV_API"
          add_property GHOSTX_API "$GHOSTX_API"
          add_property SUPERSTREAM_FIRST_API "$SUPERSTREAM_FIRST_API"
          add_property SUPERSTREAM_SECOND_API "$SUPERSTREAM_SECOND_API"
          add_property SUPERSTREAM_THIRD_API "$SUPERSTREAM_THIRD_API"
          add_property SUPERSTREAM_FOURTH_API "$SUPERSTREAM_FOURTH_API"
          add_property AsianDrama_API "$AsianDrama_API"
          add_property FanCode_API "$FanCode_API"
          add_property Whvx_API "$Whvx_API"
          add_property JapanIPTV "$JapanIPTV"
          add_property SonyIPTV "$SonyIPTV"
          add_property PirateIPTV "$PirateIPTV"
          add_property Su_sports "$Su_sports"
          add_property CatflixAPI "$CatflixAPI"
          add_property ConsumetAPI "$ConsumetAPI"
          add_property FlixHQAPI "$FlixHQAPI"
          add_property WhvxAPI "$WhvxAPI"
          add_property WhvxT "$WhvxT"
          add_property SharmaflixApikey "$SharmaflixApikey"
          add_property SharmaflixApi "$SharmaflixApi"
          add_property Theyallsayflix "$Theyallsayflix"
          add_property HianimeAPI "$HianimeAPI"
          add_property Vidsrccc "$Vidsrccc"
          add_property WASMAPI "$WASMAPI"
          add_property KissKh "$KissKh"
          add_property KisskhSub "$KisskhSub"
          add_property StreamPlayAPI "$StreamPlayAPI"
          add_property PROXYAPI "$PROXYAPI"
          add_property KAISVA "$KAISVA"
          add_property MAL_API "$MAL_API"
          add_property MOVIEBOX_SECRET_KEY_ALT "$MOVIEBOX_SECRET_KEY_ALT"
          add_property MOVIEBOX_SECRET_KEY_DEFAULT "$MOVIEBOX_SECRET_KEY_DEFAULT"
          add_property SuperToken "$SuperToken"
          add_property KAIDEC "$KAIDEC"
          add_property KAIENC "$KAIENC"
          add_property KAIMEG "$KAIMEG"
          add_property NuvioStreams "$NuvioStreams"
          add_property YFXENC "$YFXENC"
          add_property YFXDEC "$YFXDEC"
          add_property VideasyDEC "$VideasyDEC"
          add_property NuvFeb "$NuvFeb"
          add_property iStreamFlare "$iStreamFlare"
          add_property iStreamFlareSecretKey "$iStreamFlareSecretKey"
          add_property iStreamFlareSalt "$iStreamFlareSalt"

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x ./gradlew
          ./gradlew makePluginsJson --refresh-dependencies

      - name: Collect generated files
        run: |
          set -e

          rm -rf builds
          mkdir -p builds

          echo "Searching for generated CS3 files..."
          find src -type f -name "*.cs3" -print

          echo "Searching for generated JAR files..."
          find src -type f -name "*.jar" -print

          echo "Searching for plugins.json..."
          find src -type f -name "plugins.json" -print

          find src -type f -name "*.cs3" -exec cp -f {} builds/ \;
          find src -type f -name "*.jar" -exec cp -f {} builds/ \;
          find src -type f -name "plugins.json" -exec cp -f {} builds/ \;

          echo "Files copied to builds:"
          find builds -type f -print

          if [ -z "$(find builds -type f -print -quit)" ]; then
            echo "ERROR: No generated files were found."
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestRepo
          path: builds/
          if-no-files-found: error
          retention-days: 3

      - name: Push files to builds branch
        working-directory: src
        run: |
          set -e

          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add --force ../build-branch -B builds origin/builds
          else
            git worktree add --detach ../build-branch
            cd ../build-branch
            git checkout --orphan builds
            git rm -rf . || true
          fi

          cd ../build-branch

          # Remove old generated files
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          # Copy to builds branch
          cp -R ../builds/. .

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected in builds branch."
          else
            git commit -m "Build Sucessfull !"
            git push origin builds
          fi
